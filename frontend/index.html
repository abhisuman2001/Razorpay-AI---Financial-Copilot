<!doctype html>
<html lang="en">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Razorpay AI — Financial Copilot for reconciliation, cash-flow forecasting, and explainable CFO insights." />
    <script>
      try {
        const savedTheme = window.localStorage.getItem("razorpay-ai-theme");
        const themePreference = savedTheme === "light" || savedTheme === "dark" || savedTheme === "system" ? savedTheme : "system";
        const useDarkTheme = themePreference === "dark" || (themePreference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.themePreference = themePreference;
        if (useDarkTheme) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.style.colorScheme = "light";
        }
      } catch (_) {
        // Storage can be unavailable in privacy-restricted browsers; the app remains usable.
      }
    </script>
    <title>Razorpay AI — Financial Copilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
